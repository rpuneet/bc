# Deploy landing page after a successful release
# Also deploys on pushes to main that change landing/ files.
# Uses Vercel deploy hook — zero-config since Vercel auto-detects Next.js.

name: CD (landing)

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'landing/**'

permissions:
  contents: read

concurrency:
  group: cd-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Landing
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — skipping landing deploy"
            exit 0
          fi
          curl -sf -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Vercel deployment triggered"
