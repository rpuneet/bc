# Publish bc-cli to npm after a successful release
# Triggered automatically when release.yml completes successfully.
# The npm package is a thin wrapper that downloads the Go binary at install time.

name: CD (npm)

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version from release tag
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # head_branch is the tag name (e.g., v0.2.0)
          VERSION="${HEAD_BRANCH#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing bc-cli@$VERSION"

      - name: Set package version
        working-directory: packages/bc-cli
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$PKG_VERSION" --no-git-tag-version

      - name: Publish to npm
        working-directory: packages/bc-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
