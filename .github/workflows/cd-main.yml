# Continuous Deployment for main branch
# On every push to main, builds and publishes:
#   - Docker image: ghcr.io/rpuneet/mycel:main (and :main-<sha>)
#   - Does NOT create GitHub releases (use release.yml for tagged releases)
#
# This gives users a way to pull the latest bleeding-edge main:
#   docker pull ghcr.io/rpuneet/mycel:main

name: CD (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.11'
  BUN_VERSION: '1.2.15'

jobs:
  docker:
    name: Docker (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create missing dirs for Docker build
        run: mkdir -p prompts

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: docker/Dockerfile.bcd
          push: true
          tags: |
            ghcr.io/rpuneet/mycel:main
            ghcr.io/rpuneet/mycel:main-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rpuneet/mycel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=bc AI agent orchestration (main branch)
          cache-from: type=gha
          cache-to: type=gha,mode=max
