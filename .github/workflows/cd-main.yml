# Continuous Deployment for main branch
# On every push to main, builds and publishes:
#   - Docker image: ghcr.io/rpuneet/mycel:main (and :main-<sha>)
#   - Landing site (with embedded docs) to Cloudflare Pages → bc-infra.com
#   - Does NOT create GitHub releases (use release.yml for tagged releases)
#
# This gives users a way to pull the latest bleeding-edge main:
#   docker pull ghcr.io/rpuneet/mycel:main

name: CD (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.12'
  BUN_VERSION: '1.2.15'

jobs:
  docker:
    name: Docker (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: docker/Dockerfile.daemon
          push: true
          tags: |
            ghcr.io/rpuneet/mycel:main
            ghcr.io/rpuneet/mycel:main-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rpuneet/mycel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=mycel AI agent orchestration (main branch)
          # mycel's registered Google "Desktop app" OAuth client, baked into
          # the daemon binary so Gmail "Sign in with Google" works
          # zero-setup. Empty when the repo secrets aren't set (e.g. forks)
          # — the image then behaves exactly as an unconfigured server. See
          # pkg/gateway/gmail/oauth.go for why this is safe to embed.
          build-args: |
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  landing:
    name: Landing → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build landing (static export)
        working-directory: landing
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Deploy to Cloudflare Pages
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy out --project-name=mycel --branch=main --commit-hash="$GITHUB_SHA"
