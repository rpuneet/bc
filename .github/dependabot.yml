# Dependabot configuration — keeps dependencies current automatically.
# Creates PRs grouped by ecosystem on a weekly schedule.
# Security updates are created immediately regardless of schedule.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Go modules. Both are listed because desktop/go.mod carries
  # `replace github.com/rpuneet/mycel => ../`, so its indirect requirements are
  # derived from the root module's and go stale the moment a root dependency
  # moves — which CI now fails on (`go mod tidy -diff`, #3497). Grouping the two
  # directories keeps a bump in one PR that updates both, instead of a root-only
  # PR that cannot pass.
  - package-ecosystem: gomod
    directories:
      - /
      - /desktop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - infrastructure
    commit-message:
      prefix: "deps(go):"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go-minor:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci/cd
    commit-message:
      prefix: "deps(actions):"
    groups:
      actions:
        patterns: ["*"]

  # npm — Web UI
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "deps(web):"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        update-types: [minor, patch]

  # npm — Landing page
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "deps(landing):"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      landing-deps:
        update-types: [minor, patch]
