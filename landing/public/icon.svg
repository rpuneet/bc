<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- mycel mark: mushroom on an espresso field (coffee & cream palette) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="100%" stop-color="#120d08"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#ddd2bc"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc4ac"/>
      <stop offset="100%" stop-color="#b3a68d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256,266) scale(1.22) translate(-256,-266)">
    <!-- mycelium threads -->
    <g stroke="#8a6a3b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M256 400 C 235 429 200 436 165 451"/>
      <path d="M256 400 C 260 435 280 445 305 459"/>
      <path d="M256 400 C 280 423 320 426 353 442"/>
      <path d="M165 451 C 150 458 140 470 134 480" opacity="0.6"/>
      <path d="M353 442 C 370 450 378 463 382 475" opacity="0.6"/>
    </g>

    <!-- stem -->
    <path d="M224 294 L288 294 L280 382 C 278 403 267 412 256 412 C 245 412 234 403 232 382 Z" fill="url(#stem)"/>

    <!-- cap -->
    <path d="M99 264
             C 99 165 168 109 256 109
             C 344 109 413 165 413 264
             C 413 286 390 294 358 294
             L 154 294
             C 122 294 99 286 99 264 Z" fill="url(#cap)"/>

    <!-- spore speckles on the cap -->
    <g fill="#120d08" opacity="0.22">
      <circle cx="190" cy="200" r="18"/>
      <circle cx="274" cy="165" r="15"/>
      <circle cx="334" cy="226" r="13"/>
      <circle cx="236" cy="249" r="10"/>
      <circle cx="308" cy="270" r="7"/>
    </g>

    <!-- drifting spores — chanterelle amber -->
    <g fill="#e8a33d">
      <circle cx="102" cy="371" r="8"/>
      <circle cx="134" cy="410" r="6" opacity="0.75"/>
      <circle cx="411" cy="378" r="8"/>
      <circle cx="432" cy="336" r="6" opacity="0.75"/>
      <circle cx="392" cy="418" r="4.5" opacity="0.6"/>
    </g>
  </g>
</svg>
