    <line x1="256" y1="264" x2="256" y2="112"/>
    <line x1="256" y1="264" x2="349" y2="162"/>
    <line x1="256" y1="264" x2="399" y2="214"/>
    <line x1="256" y1="264" x2="408" y2="314"/>
    <line x1="256" y1="264" x2="349" y2="366"/>
    <line x1="256" y1="264" x2="256" y2="416"/>
    <line x1="256" y1="264" x2="163" y2="366"/>
    <line x1="256" y1="264" x2="104" y2="314"/>
    <line x1="256" y1="264" x2="104" y2="214"/>
    <line x1="256" y1="264" x2="163" y2="162"/>
  </g>

  <!-- Pulp curves — bolder -->
  <g stroke="#FB923C" stroke-width="2" fill="none" opacity="0.25">
    <path d="M256 135 Q285 195 340 178"/>
    <path d="M345 182 Q365 220 395 228"/>
    <path d="M400 240 Q370 270 402 308"/>
    <path d="M395 318 Q360 340 345 362"/>
    <path d="M338 368 Q300 345 260 410"/>
    <path d="M252 410 Q215 345 172 368"/>
    <path d="M165 360 Q150 330 112 310"/>
    <path d="M110 300 Q142 270 115 232"/>
    <path d="M118 222 Q150 210 165 178"/>
    <path d="M172 172 Q215 195 252 140"/>
