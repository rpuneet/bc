<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="108" fill="#0C0A08"/>

  <!-- Refined spore — organic curves radiating from center -->
  <g stroke="#EA580C" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Top tendril -->
    <path d="M256 256 Q250 200 240 140 Q235 110 220 85" opacity="0.6"/>
    <path d="M240 140 Q260 130 290 100" opacity="0.35"/>

    <!-- Top-right tendril -->
    <path d="M256 256 Q300 220 350 180 Q370 165 395 145" opacity="0.6"/>
    <path d="M350 180 Q360 200 390 210" opacity="0.35"/>

    <!-- Right tendril -->
    <path d="M256 256 Q310 260 360 280 Q390 290 415 310" opacity="0.6"/>
    <path d="M360 280 Q350 310 370 340" opacity="0.35"/>

    <!-- Bottom-right tendril -->
    <path d="M256 256 Q280 310 300 370 Q310 400 320 425" opacity="0.6"/>
    <path d="M300 370 Q330 365 355 385" opacity="0.35"/>

    <!-- Bottom tendril -->
    <path d="M256 256 Q240 310 230 370 Q225 400 215 430" opacity="0.6"/>
    <path d="M230 370 Q200 380 185 405" opacity="0.35"/>

    <!-- Left tendril -->
    <path d="M256 256 Q200 250 150 235 Q120 225 95 210" opacity="0.6"/>
    <path d="M150 235 Q145 260 120 275" opacity="0.35"/>

    <!-- Top-left tendril -->
    <path d="M256 256 Q210 220 170 175 Q150 155 130 130" opacity="0.6"/>
    <path d="M170 175 Q145 180 125 170" opacity="0.35"/>
  </g>

  <!-- Spore nodes at branch tips -->
  <g fill="#EA580C">
    <circle cx="220" cy="85" r="5"/>
    <circle cx="290" cy="100" r="4"/>
    <circle cx="395" cy="145" r="5"/>
    <circle cx="390" cy="210" r="4"/>
    <circle cx="415" cy="310" r="5"/>
    <circle cx="370" cy="340" r="4"/>
    <circle cx="320" cy="425" r="5"/>
    <circle cx="355" cy="385" r="4"/>
    <circle cx="215" cy="430" r="5"/>
    <circle cx="185" cy="405" r="4"/>
    <circle cx="95" cy="210" r="5"/>
    <circle cx="120" cy="275" r="4"/>
    <circle cx="130" cy="130" r="5"/>
    <circle cx="125" cy="170" r="4"/>
    <!-- Junction nodes -->
    <circle cx="240" cy="140" r="5" opacity="0.7"/>
    <circle cx="350" cy="180" r="5" opacity="0.7"/>
    <circle cx="360" cy="280" r="5" opacity="0.7"/>
    <circle cx="300" cy="370" r="5" opacity="0.7"/>
    <circle cx="230" cy="370" r="5" opacity="0.7"/>
    <circle cx="150" cy="235" r="5" opacity="0.7"/>
    <circle cx="170" cy="175" r="5" opacity="0.7"/>
  </g>

  <!-- Center spore body -->
  <circle cx="256" cy="256" r="16" fill="#EA580C"/>
  <circle cx="256" cy="256" r="32" fill="#EA580C" opacity="0.08"/>
  <circle cx="256" cy="256" r="56" fill="#EA580C" opacity="0.04"/>
</svg>
