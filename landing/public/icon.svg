    <path d="M256 264 L256 112 A152 152 0 0 1 349 162 Z" opacity="0.12"/>
    <path d="M256 264 L399 214 A152 152 0 0 1 408 314 Z" opacity="0.12"/>
    <path d="M256 264 L349 366 A152 152 0 0 1 256 416 Z" opacity="0.12"/>
