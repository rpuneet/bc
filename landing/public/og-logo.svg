<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- mycel social card: mushroom mark on espresso, coffee & cream palette -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="100%" stop-color="#120d08"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#ddd2bc"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc4ac"/>
      <stop offset="100%" stop-color="#b3a68d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- mark centered above the wordmark -->
  <g transform="translate(600,225) scale(0.62) translate(-256,-266)">
    <g stroke="#8a6a3b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M256 400 C 235 429 200 436 165 451"/>
      <path d="M256 400 C 260 435 280 445 305 459"/>
      <path d="M256 400 C 280 423 320 426 353 442"/>
      <path d="M165 451 C 150 458 140 470 134 480" opacity="0.6"/>
      <path d="M353 442 C 370 450 378 463 382 475" opacity="0.6"/>
    </g>
    <path d="M224 294 L288 294 L280 382 C 278 403 267 412 256 412 C 245 412 234 403 232 382 Z" fill="url(#stem)"/>
    <path d="M99 264 C 99 165 168 109 256 109 C 344 109 413 165 413 264 C 413 286 390 294 358 294 L 154 294 C 122 294 99 286 99 264 Z" fill="url(#cap)"/>
    <g fill="#120d08" opacity="0.22">
      <circle cx="190" cy="200" r="18"/>
      <circle cx="274" cy="165" r="15"/>
      <circle cx="334" cy="226" r="13"/>
      <circle cx="236" cy="249" r="10"/>
      <circle cx="308" cy="270" r="7"/>
    </g>
    <g fill="#e8a33d">
      <circle cx="102" cy="371" r="8"/>
      <circle cx="134" cy="410" r="6" opacity="0.75"/>
      <circle cx="411" cy="378" r="8"/>
      <circle cx="432" cy="336" r="6" opacity="0.75"/>
      <circle cx="392" cy="418" r="4.5" opacity="0.6"/>
    </g>
  </g>

  <!-- ambient spores across the card -->
  <g fill="#e8a33d">
    <circle cx="180" cy="140" r="5" opacity="0.35"/>
    <circle cx="240" cy="420" r="4" opacity="0.25"/>
    <circle cx="960" cy="160" r="5" opacity="0.3"/>
    <circle cx="1030" cy="400" r="4" opacity="0.25"/>
    <circle cx="880" cy="500" r="3" opacity="0.2"/>
    <circle cx="320" cy="250" r="3" opacity="0.2"/>
  </g>

  <text x="600" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="96" letter-spacing="-2" fill="#f2eadc">mycel</text>
  <text x="600" y="516" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#a79781">orchestrate teams of AI coding agents</text>
</svg>
