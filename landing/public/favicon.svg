<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- mycel favicon: simplified mushroom mark, tuned for 16-32px -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#ddd2bc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="#120d08"/>

  <g transform="translate(256,256) scale(1.42) translate(-256,-266)">
    <!-- mycelium threads — thicker so they survive tiny sizes -->
    <g stroke="#8a6a3b" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M256 400 C 235 429 200 436 165 451"/>
      <path d="M256 400 C 260 435 280 445 305 459"/>
      <path d="M256 400 C 280 423 320 426 353 442"/>
    </g>

    <!-- stem -->
    <path d="M224 294 L288 294 L280 382 C 278 403 267 412 256 412 C 245 412 234 403 232 382 Z" fill="#c4b89e"/>

    <!-- cap -->
    <path d="M99 264
             C 99 165 168 109 256 109
             C 344 109 413 165 413 264
             C 413 286 390 294 358 294
             L 154 294
             C 122 294 99 286 99 264 Z" fill="url(#cap)"/>

    <!-- spore speckles -->
    <g fill="#120d08" opacity="0.25">
      <circle cx="190" cy="200" r="20"/>
      <circle cx="280" cy="168" r="16"/>
      <circle cx="330" cy="232" r="14"/>
    </g>

    <!-- drifting spores -->
    <g fill="#e8a33d">
      <circle cx="108" cy="374" r="11"/>
      <circle cx="406" cy="380" r="11"/>
      <circle cx="428" cy="336" r="7" opacity="0.8"/>
    </g>
  </g>
</svg>
