<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- mycel web favicon: the mushroom mark on an espresso field.
       Brand palette shared with the landing and desktop icon:
       espresso #17110C ground, cream #F2EADC cap, chanterelle #E8A33D spores. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#17110C"/>

  <!-- Hyphae threads -->
  <g stroke="#E8A33D" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M256 400 C 235 429 200 436 165 451"/>
    <path d="M256 400 C 260 435 280 445 305 459"/>
    <path d="M256 400 C 280 423 320 426 353 442"/>
  </g>

  <!-- Stem -->
  <path d="M224 294 L288 294 L280 382 C 278 403 267 412 256 412 C 245 412 234 403 232 382 Z"
        fill="#D9CDB8"/>

  <!-- Cap -->
  <path d="M99 264
           C 99 165 168 109 256 109
           C 344 109 413 165 413 264
           C 413 286 390 294 358 294
           L 154 294
           C 122 294 99 286 99 264 Z" fill="#F2EADC"/>

  <!-- Spore speckles on the cap -->
  <g fill="#E8A33D" opacity="0.95">
    <circle cx="190" cy="200" r="24"/>
    <circle cx="278" cy="163" r="20"/>
    <circle cx="336" cy="228" r="17"/>
  </g>

  <!-- Drifting spores -->
  <g fill="#E8A33D">
    <circle cx="105" cy="373" r="16"/>
    <circle cx="410" cy="378" r="16"/>
    <circle cx="430" cy="332" r="10" opacity="0.75"/>
  </g>
</svg>
