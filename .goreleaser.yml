# GoReleaser configuration for mycel
# https://goreleaser.com
#
# macOS builds are handled separately in CI (release.yml) due to CGO requirements.
# Linux arm64 uses Zig as a CGO cross-compiler.
# Windows builds disable CGO (pure Go fallbacks).

version: 2

project_name: mycel

before:
  hooks:
    - go mod tidy

builds:
  # Linux amd64 — native CGO
  - id: mycel-linux-amd64
    main: ./cmd/mycel
    binary: mycel
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientID={{.Env.GOOGLE_OAUTH_CLIENT_ID}}'
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientSecret={{.Env.GOOGLE_OAUTH_CLIENT_SECRET}}'
    goos:
      - linux
    goarch:
      - amd64

  # Linux arm64 — CGO via Zig cross-compiler
  - id: mycel-linux-arm64
    main: ./cmd/mycel
    binary: mycel
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-musl -lc
      - CXX=zig c++ -target aarch64-linux-musl -lc
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientID={{.Env.GOOGLE_OAUTH_CLIENT_ID}}'
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientSecret={{.Env.GOOGLE_OAUTH_CLIENT_SECRET}}'
    goos:
      - linux
    goarch:
      - arm64

  # Windows — CGO disabled (pure Go)
  - id: mycel-windows
    main: ./cmd/mycel
    binary: mycel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientID={{.Env.GOOGLE_OAUTH_CLIENT_ID}}'
      - -X 'github.com/rpuneet/mycel/pkg/gateway/gmail.defaultGoogleClientSecret={{.Env.GOOGLE_OAUTH_CLIENT_SECRET}}'
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  # Previous tag is pinned by the Release workflow via GORELEASER_PREVIOUS_TAG
  # (scripts/previous-semver-tag.sh) so QA/evidence tags never shrink notes (#3712).
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  # A commit joins the first group whose regexp matches, in the order listed
  # here, while `order` decides where the group is displayed. Breaking and
  # Security are therefore listed first as well as ordered first: without that,
  # "fix(security): …" would be claimed by Bug Fixes and buried among the ~30
  # fixes a release typically carries, which is the one thing a reader must not
  # have to hunt for.
  groups:
    - title: Breaking Changes
      regexp: '^[a-z]+(\(.+\))?!:'
      order: 0
    - title: Security
      regexp: '^(sec|security)(\(.+\))?!?:|^[a-z]+\((sec|security)\)!?:'
      order: 1
    - title: Features
      regexp: '^feat.*'
      order: 2
    - title: Bug Fixes
      regexp: '^fix.*'
      order: 3
    - title: Refactoring
      regexp: '^refactor.*'
      order: 4
    - title: Performance
      regexp: '^perf.*'
      order: 5
    - title: Others
      order: 999

release:
  github:
    owner: rpuneet
    name: mycel
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## mycel {{ .Tag }}

    Orchestration for AI agents.

    ### Install

    | Method | Command |
    |--------|---------|
    | **Homebrew** (macOS) | `brew install rpuneet/mycel/mycel` |
    | **npm / bun** (Linux) | `npm install -g mycel-cli` or `bunx mycel-cli` |
    | **Go** | `go install github.com/rpuneet/mycel/cmd/mycel@{{ .Tag }}` |
    | **Script** | `curl -fsSL https://raw.githubusercontent.com/rpuneet/mycel/main/scripts/install.sh \| bash` |
    | **Docker** | `docker pull ghcr.io/rpuneet/mycel:{{ .Tag }}` |
    | **Scoop** (Windows) | `scoop bucket add mycel https://github.com/rpuneet/scoop-mycel && scoop install mycel` |
  footer: |
    ---

    **Full Changelog**: https://github.com/rpuneet/mycel/compare/{{ .PreviousTag }}...{{ .Tag }}


nfpms:
  - id: mycel-linux
    package_name: mycel
    homepage: https://bc-infra.com
    description: Orchestration for AI agents
    license: MIT
    maintainer: "rpuneet <rpuneet@users.noreply.github.com>"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
