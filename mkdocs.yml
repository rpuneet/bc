site_name: mycel Documentation
site_description: Multi-agent AI orchestration CLI
site_author: mycel contributors
site_url: https://rpuneet.github.io/mycel

repo_name: rpuneet/mycel
repo_url: https://github.com/rpuneet/mycel
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Skip underscore-prefixed archive drafts (rehabilitated notifications
# page has been renamed to architecture-notifications.md and is wired
# into the nav below).
exclude_docs: |
  _*
  README.md
  screenshots/
  proposals/
  deps/

nav:
  - Home: index.md
  - Overview: overview.md
  - Tutorials:
    - tutorials/index.md
    - Getting started: tutorials/getting-started.md
    - Your first agent: tutorials/first-agent.md
  - How To:
    - how-to/index.md
    - Configure mycel: how-to/configure.md
    - Set up apps: how-to/set-up-apps.md
    - Manage secrets: how-to/manage-secrets.md
    - Inject instructions: how-to/inject-instructions.md
    - Browse the marketplace: how-to/browse-the-marketplace.md
    - Read insights: how-to/read-insights.md
    - Troubleshoot: how-to/troubleshoot.md
  - Explanation:
    - explanation/index.md
    - Architecture: explanation/architecture.md
    - Agents: explanation/agents.md
    - Agent lifecycle redesign: explanation/agent-lifecycle-redesign.md
    - Database: explanation/database.md
    - Web UI: explanation/web-ui.md
    - Design system: explanation/design-system.md
    - Networking: explanation/networking.md
    - Notification architecture: architecture-notifications.md
    - Security: explanation/security.md
    - Deployment: explanation/deployment.md
    - CI / CD: explanation/ci-cd.md
    - MCP protocol: explanation/mcp.md
    - Design decisions: explanation/design-decisions.md
  - Reference:
    - REST API: reference/api-rest.md
    - Settings API: reference/api-settings.md
  - Contributing:
    - Testing guide: contributing/testing.md
  - ADR:
    - 0001 — CLI architecture: adr/0001-cli-architecture.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rpuneet/mycel
