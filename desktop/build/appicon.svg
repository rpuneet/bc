<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- mycel desktop app icon: spore/mushroom mark on a dark organic field -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#1c221e"/>
      <stop offset="100%" stop-color="#0e1210"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2eee2"/>
      <stop offset="100%" stop-color="#d9d3c0"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc8b4"/>
      <stop offset="100%" stop-color="#b3ab95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- mycelium threads -->
  <g stroke="#4f6547" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M512 800 C 470 858 400 872 330 902"/>
    <path d="M512 800 C 520 870 560 890 610 918"/>
    <path d="M512 800 C 560 846 640 852 706 884"/>
    <path d="M330 902 C 300 916 280 940 268 960" opacity="0.6"/>
    <path d="M706 884 C 740 900 756 926 764 950" opacity="0.6"/>
  </g>

  <!-- stem -->
  <path d="M448 588 L576 588 L560 764 C 556 806 534 824 512 824 C 490 824 468 806 464 764 Z" fill="url(#stem)"/>

  <!-- cap -->
  <path d="M198 528
           C 198 330 336 218 512 218
           C 688 218 826 330 826 528
           C 826 572 780 588 716 588
           L 308 588
           C 244 588 198 572 198 528 Z" fill="url(#cap)"/>

  <!-- spore speckles on the cap -->
  <g fill="#0e1210" opacity="0.22">
    <circle cx="380" cy="400" r="36"/>
    <circle cx="548" cy="330" r="30"/>
    <circle cx="668" cy="452" r="26"/>
    <circle cx="472" cy="498" r="20"/>
    <circle cx="616" cy="540" r="14"/>
  </g>

  <!-- drifting spores -->
  <g fill="#8fae72">
    <circle cx="204" cy="742" r="16"/>
    <circle cx="268" cy="820" r="12" opacity="0.75"/>
    <circle cx="822" cy="756" r="16"/>
    <circle cx="864" cy="672" r="12" opacity="0.75"/>
    <circle cx="784" cy="836" r="9" opacity="0.6"/>
  </g>
</svg>
